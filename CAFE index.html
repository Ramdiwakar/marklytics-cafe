<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marklytics CAFE Compliance Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060A14; --bg2:#0A1122; --surface:rgba(18,28,52,.55); --panel:rgba(14,22,42,.72); --panel-solid:#0E1730;
  --line:rgba(120,160,255,.14); --line-strong:rgba(120,160,255,.28);
  --text:#EEF2FA; --muted:#A3AFC6; --faint:#6E7B96;
  --red:#FF2E4C; --coral:#F66864; --blue:#3D7BFF; --brand-blue:#004AB2; --cyan:#27C8E0; --green:#A9C380; --green-ink:#B9DA8A; --soft:#B56767;
  --blue-tint:rgba(61,123,255,.12); --red-tint:rgba(255,46,76,.13); --green-tint:rgba(169,195,128,.16);
  --glow-blue:0 0 18px rgba(61,123,255,.45); --glow-red:0 0 18px rgba(255,46,76,.45);
  --grid:rgba(120,160,255,.055);
  --shadow:0 0 0 1px rgba(120,160,255,.06), 0 20px 50px -24px rgba(0,0,0,.8);
  --head:"Aptos","Aptos Display","Lato","Segoe UI",system-ui,sans-serif;
  --body:"Lato","Aptos","Segoe UI",system-ui,sans-serif;
  --side:clamp(232px,15vw,300px);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark } }
:root[data-theme="dark"]{ color-scheme:dark }
:root[data-theme="light"]{
  --bg:#F3F6FC; --bg2:#E9EEF8; --surface:rgba(255,255,255,.6); --panel:rgba(255,255,255,.82); --panel-solid:#FFFFFF;
  --line:rgba(0,74,178,.13); --line-strong:rgba(0,74,178,.26);
  --text:#121826; --muted:#4F5A6E; --faint:#7A8599;
  --red:#E8223B; --blue:#004AB2; --cyan:#0E97AD; --green-ink:#4A6820;
  --blue-tint:rgba(0,74,178,.08); --red-tint:rgba(232,34,59,.08); --green-tint:rgba(169,195,128,.25);
  --glow-blue:0 0 14px rgba(0,74,178,.25); --glow-red:0 0 14px rgba(232,34,59,.25);
  --grid:rgba(0,74,178,.06); --shadow:0 1px 2px rgba(18,24,38,.06), 0 18px 40px -24px rgba(0,74,178,.35);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(14px, calc(.5vw + 7.6px), 20px);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60vw 50vh at 12% -10%, rgba(61,123,255,.22), transparent 60%),
   radial-gradient(50vw 50vh at 100% 110%, rgba(255,46,76,.12), transparent 60%),
   linear-gradient(var(--grid) 1px, transparent 1px) 0 0/3.2rem 3.2rem,
   linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/3.2rem 3.2rem,
   linear-gradient(180deg,var(--bg),var(--bg2));}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,2.4vw,3rem)} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}
.tag{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}

#flow{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.bg-pick{margin-top:.9rem}
#bgSel{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}
#bgSel button{position:relative;border:1px solid var(--line-strong);background:rgba(4,8,18,.4);border-radius:.4rem;height:2rem;cursor:pointer;padding:0;overflow:hidden}
:root[data-theme="light"] #bgSel button{background:#fff}
#bgSel button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#bgSel button[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(39,200,224,.2)}
.bg-ic{position:absolute;inset:3px;border-radius:3px;opacity:.85}
.bg-calm{background:linear-gradient(transparent 58%,var(--blue) 58% 62%,transparent 62% 76%,var(--cyan) 76% 79%,transparent 79%)}
.bg-constellation{background:radial-gradient(circle at 25% 35%,var(--cyan) 1.6px,transparent 2px),radial-gradient(circle at 70% 25%,var(--cyan) 1.6px,transparent 2px),radial-gradient(circle at 55% 75%,var(--red) 1.6px,transparent 2px),linear-gradient(20deg,transparent 48%,var(--line-strong) 49% 51%,transparent 52%)}
.bg-contour{background:repeating-radial-gradient(circle at 85% 15%,transparent 0 4px,var(--blue) 4px 5px)}
.bg-signal{background:linear-gradient(var(--line-strong) 1px,transparent 1px) 0 0/6px 6px,linear-gradient(90deg,var(--line-strong) 1px,transparent 1px) 0 0/6px 6px,radial-gradient(circle at 60% 50%,var(--cyan) 2px,transparent 3px)}
.bg-none{background:linear-gradient(var(--line-strong) 1px,transparent 1px) 0 0/6px 6px,linear-gradient(90deg,var(--line-strong) 1px,transparent 1px) 0 0/6px 6px}
/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(10,17,34,.86),rgba(6,10,20,.92));backdrop-filter:blur(14px);display:flex;flex-direction:column;padding:1.6rem 1rem 1.1rem;overflow-y:auto;z-index:20}
:root[data-theme="light"] .side{background:rgba(255,255,255,.86)}
.brand{display:flex;align-items:center;padding:.2rem .7rem 1.4rem}
.brand img{height:1.6rem;width:auto}
.logo-pri{display:none}
:root[data-theme="light"] .logo-pri{display:block} :root[data-theme="light"] .logo-rev{display:none}
.nav-group{margin-top:1.3rem}
.nav-label{padding:0 .8rem .45rem}
.nav a{white-space:nowrap;display:flex;align-items:center;gap:.8rem;padding:.65rem .8rem;border-radius:.6rem;color:var(--muted);text-decoration:none;font-weight:700;font-size:.95rem;position:relative;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.nav a svg{width:1.3rem;height:1.3rem;flex:none}
.nav a:hover{background:var(--blue-tint);color:var(--text)}
.nav a.active{color:var(--text);background:linear-gradient(90deg,rgba(61,123,255,.22),rgba(61,123,255,.04));border-color:var(--line-strong)}
.nav a.active::before{content:"";position:absolute;left:-1rem;top:.55rem;bottom:.55rem;width:3px;background:var(--red);box-shadow:var(--glow-red);border-radius:0 3px 3px 0}
.nav a.active svg{color:var(--cyan)}
.nav .soon{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(39,200,224,.35);border-radius:2rem;padding:.05rem .5rem}
.nav .count{margin-left:auto;font-size:.78rem;color:var(--cyan);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:1rem .6rem 0}
.side-foot > svg{display:block;width:100%;height:4rem;color:var(--blue);opacity:.7}
.side-foot small{display:block;color:var(--faint);font-size:.78rem;margin-top:.5rem;line-height:1.45}
.theme-btn{display:flex;align-items:center;gap:.5rem;background:none;border:1px solid var(--line-strong);border-radius:.5rem;padding:.4rem .7rem;font-size:.82rem;color:var(--muted);cursor:pointer;margin-top:.8rem}
.theme-btn svg{width:1rem;height:1rem}
.theme-btn:hover{color:var(--text);border-color:var(--cyan)}

.main{min-width:0;position:relative}
.topbar{display:none}
.statusbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem clamp(1.2rem,2.4vw,3.2rem);border-bottom:1px solid var(--line);background:rgba(6,10,20,.6);backdrop-filter:blur(12px);font-size:.82rem;color:var(--muted)}
:root[data-theme="light"] .statusbar{background:rgba(243,246,252,.75)}
.crumbs{display:flex;align-items:center;gap:.6rem}
.crumbs b{color:var(--text)}
.crumbs .sep{width:1.2rem;height:1px;background:var(--line-strong)}
.sys{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.sys span{display:inline-flex;align-items:center;gap:.45rem}
.live{width:.5rem;height:.5rem;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(169,195,128,.6);animation:live 2.4s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(169,195,128,.55)}70%{box-shadow:0 0 0 .55rem rgba(169,195,128,0)}100%{box-shadow:0 0 0 0 rgba(169,195,128,0)}}
.page{width:100%;padding:clamp(1.4rem,2.2vw,3rem) clamp(1.2rem,2.4vw,3.2rem) 4rem}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem 1.6rem;margin-bottom:1.6rem}
.page-head p{color:var(--muted);margin-top:.45rem;max-width:72ch}
.actions{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center}

/* ---------- controls ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:.55rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:.6rem 1rem;border-radius:.55rem;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,box-shadow .15s;backdrop-filter:blur(8px)}
.btn svg{width:1.15rem;height:1.15rem}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(39,200,224,.08)}
.btn.primary{background:linear-gradient(180deg,#FF4560,#E8223B);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(255,46,76,.7)}
.btn.primary:hover{box-shadow:0 0 0 3px rgba(255,46,76,.18),0 8px 24px -8px rgba(255,46,76,.8)}
.btn.blue{background:linear-gradient(180deg,#2B6BFF,#004AB2);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(61,123,255,.7)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);backdrop-filter:none}
.btn.ghost:hover{color:var(--text);background:var(--blue-tint);box-shadow:none}
.btn.sm{padding:.38rem .7rem;font-size:.82rem}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:.35rem}
.field > span:first-child,.field-l{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.input,select.input{border:1px solid var(--line-strong);background:rgba(4,8,18,.5);border-radius:.55rem;padding:.55rem .75rem;font-size:.9rem;color:var(--text);font-weight:400;min-width:0}
:root[data-theme="light"] .input{background:#fff}
select.input option,select.grid-in option{background:var(--panel-solid);color:var(--text)}
.input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(39,200,224,.15)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:.6rem;padding:.2rem;background:rgba(4,8,18,.4)}
:root[data-theme="light"] .seg{background:#fff}
.seg button{border:0;background:none;padding:.45rem .9rem;border-radius:.4rem;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#2B6BFF,#004AB2);color:#fff;box-shadow:var(--glow-blue)}

/* ---------- panels ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:.9rem;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.hud::before,.hud::after{content:"";position:absolute;width:1.1rem;height:1.1rem;pointer-events:none;border-color:var(--cyan);border-style:solid;opacity:.75}
.hud::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:.9rem}
.hud::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:.9rem}
.panel-pad{padding:1.4rem 1.5rem}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;padding:1.1rem 1.5rem;border-bottom:1px solid var(--line)}
.panel-head p{color:var(--muted);font-size:.85rem;margin-top:.15rem}
.stack{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
.stack>*,.pg>*,.two>*,.result>*{min-width:0}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ---------- results ---------- */
.result{display:grid;grid-template-columns:minmax(15rem,.62fr) minmax(0,1.5fr) minmax(0,1.25fr)}
.ring-col{padding:1.4rem 1rem 1.2rem 1.4rem;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.result-main{padding:1.5rem 1.6rem;border-right:1px solid var(--line);display:flex;flex-direction:column}
.verdict{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--head);font-weight:700;font-size:.95rem;padding:.45rem .95rem .45rem .8rem;border-radius:2rem;letter-spacing:.02em}
.badge .pip{width:.55rem;height:.55rem;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.badge.ok{color:var(--green-ink);background:var(--green-tint);border:1px solid rgba(169,195,128,.35)}
.badge.bad{color:var(--red);background:var(--red-tint);border:1px solid rgba(255,46,76,.35)}
.badge.idle{color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.verdict-line{color:var(--muted);font-size:.9rem}
.ruler{margin-top:auto;padding-top:1rem;width:100%;height:auto;display:block;overflow:visible}
.ruler text{font-family:var(--body);font-size:12px;fill:var(--faint)}
.ruler .lbl{font-size:14px;font-weight:700;font-family:var(--head)}
.metrics{display:grid;grid-template-columns:1fr 1fr;align-content:stretch}
.metric{padding:1rem 1.25rem;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.metric:nth-child(2n){border-right:0}
.metric:nth-last-child(-n+2){border-bottom:0}
.metric .k{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.metric .v{font-family:var(--head);font-size:clamp(1.3rem,1.5vw,1.9rem);font-weight:700;margin-top:.15rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.metric .u{font-size:.75rem;color:var(--faint);font-weight:400;margin-left:.2rem;font-family:var(--body)}
.metric .s{font-size:.75rem;color:var(--faint)}
.pos{color:var(--green-ink)} .neg{color:var(--red)}
.ring{width:100%;max-width:17rem;height:auto;display:block;overflow:visible}
.ring text{font-family:var(--head)}
.ring .spin{transform-origin:150px 150px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;text-align:left;padding:.7rem .55rem;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--panel-solid);position:sticky;top:0;z-index:1}
td{padding:.32rem .55rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--blue-tint)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.grid-in{width:100%;border:1px solid transparent;background:transparent;border-radius:.4rem;padding:.42rem .5rem;font-size:.88rem;min-width:4rem;color:var(--text)}
.grid-in::placeholder{color:var(--faint);opacity:.55}
.grid-in:hover{border-color:var(--line-strong)}
.grid-in:focus{border-color:var(--cyan);background:rgba(4,8,18,.6);outline:none;box-shadow:0 0 0 3px rgba(39,200,224,.15)}
:root[data-theme="light"] .grid-in:focus{background:#fff}
.grid-in.n{text-align:right;font-variant-numeric:tabular-nums}
.w-s{min-width:4.8rem}.w-m{min-width:6.8rem}.w-l{min-width:9rem}
tr.bad td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.bad .flag{color:var(--red)}
tr.blank .calc{opacity:.3}
.calc{color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chk{width:1.05rem;height:1.05rem;accent-color:var(--blue);cursor:pointer}
.row-act{display:flex;gap:2px;justify-content:flex-end}
.icon-btn{border:0;background:none;color:var(--faint);padding:.35rem;border-radius:.35rem;cursor:pointer;display:inline-flex}
.icon-btn:hover{color:var(--text);background:var(--blue-tint)}
.icon-btn.del:hover{color:var(--red)}
.icon-btn svg{width:1.05rem;height:1.05rem}
.issues{margin:.9rem 1.5rem .3rem;padding:.65rem .9rem;border-radius:.5rem;background:var(--red-tint);color:var(--red);font-size:.85rem;font-weight:700;border:1px solid rgba(255,46,76,.3)}
.empty{padding:3rem 1.5rem;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:.4rem}
.empty .actions{justify-content:center;margin-top:1rem}
.status-dot{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;font-size:.82rem}
.status-dot::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.status-dot.ok{color:var(--green-ink)} .status-dot.bad{color:var(--red)}
.addbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.addbar .input{width:4.6rem;text-align:right}
.fill-meter{display:inline-flex;align-items:center;gap:.6rem;font-size:.82rem;color:var(--muted)}
.fill-meter .track{width:7rem;height:.35rem;border-radius:1rem;background:var(--line);overflow:hidden}
.fill-meter .track i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:var(--glow-blue);transition:width .3s}

details.notes{border-top:1px solid var(--line)}
details.notes summary{cursor:pointer;padding:1rem 1.5rem;font-weight:700;font-family:var(--head)}
details.notes .body{padding:0 1.5rem 1.4rem;color:var(--muted);font-size:.86rem;display:grid;gap:.65rem}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.5rem 1.4rem}
.kv div{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px dashed var(--line-strong);padding:.25rem 0}
.kv b{color:var(--text);font-variant-numeric:tabular-nums}
a{color:var(--cyan)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1.2rem,2.5vw,3rem);align-items:stretch;margin-bottom:1.6rem;min-height:min(62vh,44rem)}
.hero-copy{display:flex;flex-direction:column;justify-content:center;padding:1rem 0}
.hero-copy h1{font-size:clamp(2.6rem,4.6vw,5.6rem);line-height:1;letter-spacing:-.03em;max-width:14ch}
.hero-copy h1 .glow{color:transparent;background:linear-gradient(90deg,#fff 0%,#9CC0FF 45%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text}
:root[data-theme="light"] .hero-copy h1 .glow{background:linear-gradient(90deg,#121826,#004AB2 60%,#0E97AD)}
.hero-copy p{color:var(--muted);font-size:clamp(1rem,1.05vw,1.25rem);margin:1.2rem 0 1.8rem;max-width:54ch}
.hero-card{padding:1.6rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;align-content:center}
.hero-card .cap{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.hero-card .big{font-family:var(--head);font-size:2.4rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:.35rem}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;border-top:1px solid var(--line);padding-top:1rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem}
.tile{padding:1.3rem 1.4rem;display:flex;flex-direction:column;gap:.5rem;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
a.tile:hover{border-color:var(--cyan)}
.tile svg.ic{width:1.6rem;height:1.6rem;color:var(--cyan)}
.tile p{color:var(--muted);font-size:.9rem}
.mini-list{list-style:none;margin:.4rem 0 0;padding:0;font-size:.86rem}
.mini-list li{display:flex;justify-content:space-between;gap:.6rem;padding:.45rem 0;border-top:1px solid var(--line)}
.mini-list li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- playground ---------- */
.pg{display:grid;grid-template-columns:minmax(19rem,22rem) minmax(0,1fr);gap:1.25rem;align-items:start}
.pg-controls{position:sticky;top:4.2rem}
.slider-row{padding:.9rem 0;border-top:1px solid var(--line)}
.slider-row:first-child{border-top:0}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:.9rem}
.slider-top b{font-family:var(--head)}
.slider-top .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--cyan)}
.slider-sub{font-size:.75rem;color:var(--faint);margin-top:.1rem}
input[type=range]{width:100%;margin:.6rem 0 0;accent-color:var(--blue);height:1.4rem;cursor:pointer}
.swatch{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.45rem;vertical-align:baseline}
.mix{display:grid;gap:.6rem}
.mix-row{display:grid;grid-template-columns:6.2rem 1fr 3.6rem;gap:.75rem;align-items:center;font-size:.84rem}
.mix-bars{display:grid;gap:3px}
.bar{height:.5rem;border-radius:.3rem;background:var(--line)}
.bar i{display:block;height:100%;border-radius:.3rem;transition:width .35s ease}
.cmp td,.cmp th{padding:.65rem .8rem}
.cmp td:first-child{color:var(--muted);font-weight:700}
.delta-up{color:var(--red)} .delta-down{color:var(--green-ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
.pg-two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.pg-top{display:grid;grid-template-columns:minmax(13rem,.45fr) minmax(0,1.55fr);align-items:center}

/* ---------- misc ---------- */
.toast-wrap{position:fixed;right:1.3rem;bottom:calc(1.3rem + env(safe-area-inset-bottom,0px));display:grid;gap:.6rem;z-index:100;max-width:min(26rem,calc(100vw - 2.6rem))}
.toast{background:var(--panel-solid);color:var(--text);border:1px solid var(--line-strong);border-left:3px solid var(--cyan);padding:.75rem 1rem;border-radius:.6rem;font-size:.88rem;box-shadow:var(--shadow);animation:tin .25s ease}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:.1rem .55rem;border-radius:2rem;background:var(--blue-tint);color:var(--cyan);border:1px solid var(--line-strong);letter-spacing:.03em}
.code-list{display:grid;font-size:.88rem}
.code-list div{display:grid;grid-template-columns:16rem 8rem 1fr;gap:1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.code-list div:first-child{border-top:0;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(2,4,10,.6);z-index:15;display:none}
.drop{border:1px dashed var(--line-strong);border-radius:.7rem;padding:1rem;text-align:center;color:var(--muted);font-size:.88rem;transition:border-color .15s,background .15s;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(120,160,255,.025) 10px 20px)}
.drop.on{border-color:var(--cyan);background:rgba(39,200,224,.08);color:var(--text)}
.doc-bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;padding:1.1rem 1.5rem}
.doc-bar .drop{flex:1;min-width:16rem}

@media (max-width:1280px){
  .result{grid-template-columns:minmax(13rem,.7fr) minmax(0,1.5fr)}
  .metrics{grid-column:1/-1;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
  .result-main{border-right:0}
  .metric:nth-child(2n){border-right:1px solid var(--line)} .metric:nth-child(4n){border-right:0}
  .metric:nth-last-child(-n+2){border-bottom:1px solid var(--line)} .metric:nth-last-child(-n+4){border-bottom:0}
  .pg{grid-template-columns:minmax(17rem,20rem) minmax(0,1fr)}
}
@media (max-width:1024px){
  .pg{grid-template-columns:1fr} .pg-controls{position:static}
  .hero{grid-template-columns:1fr;min-height:0}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;width:min(17.5rem,84vw);transform:translateX(-100%);transition:transform .25s ease;padding-top:calc(1.6rem + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .overlay{display:block}
  .topbar{display:flex;align-items:center;gap:.8rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:13;background:var(--panel-solid);border-bottom:1px solid var(--line);padding:.6rem 1rem}
  .topbar img{height:1.25rem}
  .statusbar{display:none}
  .result{grid-template-columns:1fr} .ring-col{border-right:0;border-bottom:1px solid var(--line)}
  .tiles,.two,.pg-two,.pg-top{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .metric:nth-child(2n){border-right:0} .metric:nth-child(4n){border-right:0}
  .metric:nth-last-child(-n+4){border-bottom:1px solid var(--line)} .metric:nth-last-child(-n+2){border-bottom:0}
  .hero-stats{grid-template-columns:1fr 1fr}
  .code-list div{grid-template-columns:1fr;gap:.1rem} .code-list div:first-child{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
// ===== CAFE II engine: mirrors INDIA_CAFE_2_Calculator.xlsx =====
const CAFE2 = {
  a: 0.002, b: 1082, c: 4.7694, conv: 23.7135, techFactor: 0.98, maxTech: 9,
  sc: { 'Petrol':1, 'Diesel':1, 'CNG':1, 'LPG':1, 'ICE / Other':1, 'Strong HEV':2, 'PHEV/REEV':2.5, 'BEV':3 },
  threshold: 0.2, base: 1000000, lower: 25000, upper: 50000, crore: 10000000
};
const FUELS = Object.keys(CAFE2.sc);
function normFuel(v){
  if (v==null) return '';
  const s = String(v).trim().toLowerCase().replace(/[_]/g,' ');
  if (!s) return '';
  if (/^(bev|ev|electric|battery)/.test(s) || s==='battery electric vehicle') return 'BEV';
  if (/phev|plug|reev|range ext/.test(s)) return 'PHEV/REEV';
  if (/strong|shev|^hev|hybrid/.test(s)) return 'Strong HEV';
  if (/cng/.test(s)) return 'CNG';
  if (/lpg/.test(s)) return 'LPG';
  if (/diesel/.test(s)) return 'Diesel';
  if (/petrol|gasoline/.test(s)) return 'Petrol';
  if (/ice|other/.test(s)) return 'ICE / Other';
  return null; // unrecognised
}
function yn(v){ if (v===true||v===1) return 'Y'; const s=String(v??'').trim().toLowerCase(); return (s==='y'||s==='yes'||s==='1'||s==='true')?'Y':'N'; }
function num(v){ if (v===''||v==null) return null; const n = typeof v==='number'? v : parseFloat(String(v).replace(/,/g,'')); return isFinite(n)? n : null; }
function piOfficial(r, minTech){
  const f = r.co2||0; let n=0;
  ['regen','ss','tpms','six'].forEach(k=>{ if(r[k]==='Y') n++; });
  if (minTech!=null) n = Math.max(n, minTech);
  const S = Math.max(0, f*Math.pow(CAFE2.techFactor,n) - (r.other||0));
  return Math.max(0, Math.max(f-CAFE2.maxTech, S));
}
function isBlank(r){ return !String(r.brand??'').trim() && !String(r.model??'').trim() && !String(r.line??'').trim() && r.co2==null && r.mass==null && r.vol==null; }
function rowIssues(r){
  const out=[];
  if (!r.fuel) out.push('Select a fuel type'); else if (!(r.fuel in CAFE2.sc)) out.push('Fuel type not recognised');
  if (r.vol==null) out.push('Enter volume'); else if (r.vol<0) out.push('Volume cannot be negative');
  if (r.mass==null) out.push('Enter unladen mass');
  if (r.co2==null && r.fuel!=='BEV') out.push('Enter pi CO₂');
  return out;
}
function penaltyFor(Pg, Tg, J){
  const gap = Math.max(0, Pg/CAFE2.conv - Tg/CAFE2.conv);
  if (Pg<=Tg) return {gap, tier:'No penalty', inr:0};
  const per = gap<=CAFE2.threshold? CAFE2.lower : CAFE2.upper;
  return {gap, tier: gap<=CAFE2.threshold? 'Gap up to 0.2 L/100km':'Gap above 0.2 L/100km', inr: CAFE2.base + per*J};
}
function calcCafe2(rows, opts={}){
  const filled = rows.filter(r=>!isBlank(r));
  const valid = filled.filter(r=>rowIssues(r).length===0);
  let J=0,L=0,NP=0,nW=0, s={nosc:0,sc:0,f1:0,f2:0,f4:0,m9:0};
  const lines = rows.map(r=>{
    if (isBlank(r)) return {ok:false, blank:true, issues:[]};
    const ok = rowIssues(r).length===0;
    if(!ok) return {ok:false, issues:rowIssues(r)};
    const v = CAFE2.sc[r.fuel], N = r.vol*v, pi = piOfficial(r, opts.minTech), f=r.co2||0;
    J+=r.vol; L+=N; NP+=N*pi; nW+=r.vol*r.mass;
    s.nosc += r.vol*f; s.sc += N*f;
    s.f1 += N*Math.max(0,Math.max(f-9,f*0.98)); s.f2 += N*Math.max(0,Math.max(f-9,f*0.98**2));
    s.f4 += N*Math.max(0,Math.max(f-9,f*0.98**4)); s.m9 += N*Math.max(0,f-9);
    return {ok:true, v, N, pi};
  });
  if (!J || !L) return {empty:true, lines, count:valid.length, filled:filled.length};
  const P = NP/L, W = nW/J, T = (CAFE2.a*(W-CAFE2.b)+CAFE2.c)*CAFE2.conv;
  const pen = penaltyFor(P,T,J);
  const mk = (name, sc, tech, p)=>{ const pn=penaltyFor(p,T,J); return {name, sc, tech, P:p, PL:p/CAFE2.conv, credit:(T-p)*J/1e6, complied:p<=T, penaltyCr:pn.inr/CAFE2.crore}; };
  const scen = [
    mk('No supercredits, no technology','No','None', s.nosc/J),
    mk('Supercredits, no technology','Yes','None', s.sc/L),
    mk('One 0.98 factor on all emitting lines','Yes','1 certified factor', s.f1/L),
    mk('Two 0.98 factors on all emitting lines','Yes','2 certified factors', s.f2/L),
    mk('All four 0.98 factors on all emitting lines','Yes','4 factors, 9 g cap', s.f4/L),
    mk('Upper bound: 9 g/km off every emitting line','Yes','Maximum 9 g/km', s.m9/L),
  ];
  return { J, L, W, P, T, PL:P/CAFE2.conv, TL:T/CAFE2.conv, margin:T-P, credit:(T-P)*J/1e6,
    complied: P<=T, gap:pen.gap, tier:pen.tier, penaltyINR:pen.inr, penaltyCr:pen.inr/CAFE2.crore,
    lines, scen, count:valid.length, filled:filled.length, invalid: filled.length-valid.length };
}

const isComputed = h => /ni x|x pi|x wi|illustrative|effective|product|official|before|after|factor|cnf|flag|variance|sum|review/.test(h);
function mapHeader(row){
  const h = row.map(c=>String(c??'').toLowerCase().replace(/\s+/g,' ').trim());
  const find = (re, extra)=> h.findIndex(x=> x && re.test(x) && !isComputed(x) && (!extra || extra(x)));
  const m = {
    brand: find(/brand|make|oem|manufacturer/),
    line: find(/variant|calculation line|^line|version/),
    model: find(/model/, x=>!/line|variant/.test(x)),
    fuel: find(/fuel|powertrain/, x=>!/volume|sum|source/.test(x)),
    co2: find(/co2|co₂|emission/),
    mass: find(/mass|weight|kerb|unladen/),
    regen: find(/regen/), ss: find(/start.?stop/), tpms: find(/tpms|tyre|tire/), six: find(/6\+?\s*-?\s*speed|6 or more|six/),
    other: find(/other/),
  };
  let vol = h.findIndex(x=>/ni actual|actual volume/.test(x));
  if (vol<0) vol = find(/volume|sales|units|qty|quantity/, x=>!/adj|extra|manual|override|petrol|diesel|cng|bev|shev|monthly/.test(x));
  m.vol = vol;
  m.adj = h.findIndex(x=>/manual adj|extra volume/.test(x));
  if (h[vol] && /ni actual|actual volume/.test(h[vol])) m.adj = -1;
  const score = (m.fuel>=0)+(m.co2>=0)+(m.vol>=0)+(m.mass>=0)+(m.model>=0);
  return {m, score};
}
function parseWorkbook(wb){
  const order = [...wb.SheetNames].sort((a,b)=>{ const p = n=>/cafe ii input|input/i.test(n)?0:/model calc/i.test(n)?1:2; return p(a)-p(b); });
  for (const name of order){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
    let best=null;
    for (let i=0;i<Math.min(25,aoa.length);i++){ const r = mapHeader(aoa[i]); if (r.m.fuel>=0 && r.score>=4 && (!best || r.score>best.score)) best = {...r, i}; }
    if (!best) continue;
    const {m} = best, rows=[], skipped=[];
    for (let j=best.i+1;j<aoa.length;j++){
      const a = aoa[j], g = k => m[k]>=0? a[m[k]] : '';
      const brand = String(g('brand')).trim(), model = String(g('model')).trim();
      if (/^example/i.test(brand) || /total/i.test(brand+' '+model)) continue;
      const fuelRaw = g('fuel'); const volRaw = num(g('vol'));
      if (!brand && !model && !String(g('line')).trim()) continue;
      if (String(fuelRaw).trim()==='' && (!model || volRaw==null)) continue;
      let vol = volRaw; if (m.adj>=0 && num(a[m.adj])!=null) vol = (vol||0)+num(a[m.adj]);
      const fuel = normFuel(fuelRaw);
      const row = {id:uid(), brand, model, line:String(g('line')).trim(), fuel: fuel===null? String(fuelRaw) : fuel, co2:num(g('co2')), mass:num(g('mass')), vol, regen:yn(g('regen')), ss:yn(g('ss')), tpms:yn(g('tpms')), six:yn(g('six')), other:num(g('other'))||0};
      if (row.fuel==='BEV' && row.co2==null) row.co2 = 0;
      rows.push(row);
    }
    if (rows.length) return {rows, sheet:name};
  }
  return null;
}
function mostCommon(arr){ const c={}; arr.filter(Boolean).forEach(x=>c[x]=(c[x]||0)+1); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||''; }
async function handleFile(file){
  if (!file) return;
  if (typeof XLSX==='undefined'){ toast('The Excel reader did not load. Check your connection and reload the page.', true); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const res = parseWorkbook(wb);
    if (!res){ toast('No CAFE II table found in '+file.name+'. Use the template headers: Fuel Type, pi CO2, Unladen Mass and Volume.', true); return; }
    const manufacturer = mostCommon(res.rows.map(r=>r.brand));
    const d = upsertDoc({name:file.name.replace(/\.(xlsx|xlsm|xls|csv)$/i,''), source:'Upload', rows:res.rows, manufacturer});
    loadDocToWork(d);
    const bad = res.rows.filter(r=>rowIssues(r).length).length;
    toast(`Loaded ${res.rows.length} lines from sheet "${res.sheet}".`+(bad? ` ${bad} need attention.`:''));
    if (route()!=='cafe2') location.hash='#cafe2'; else render();
  }catch(e){ console.error(e); toast('Could not read '+file.name+'. Save it as .xlsx and try again.', true); }
}
function loadDocToWork(d){
  state.rows = padRows(JSON.parse(JSON.stringify(d.rows)).map(r=>({...r, id:r.id||uid()})));

/* ================= visual: precision ruler ================= */
function niceStep(span){ const raw=span/36, p=Math.pow(10,Math.floor(Math.log10(raw))); for (const m of [1,2,2.5,5,10]) if (raw<=m*p) return m*p; return 10*p; }
function rulerSVG(el, P, T, P2){
  const vals=[P,T].concat(P2!=null?[P2]:[]);
  const lo0=Math.min(...vals), hi0=Math.max(...vals), pad=Math.max(5, (hi0-lo0)*0.35);
  const step=niceStep(hi0-lo0+2*pad), lo=Math.floor((lo0-pad)/step)*step, hi=Math.ceil((hi0+pad)/step)*step;
  const Wd=620, H=P2!=null?156:136, x0=14, x1=Wd-14, sx=v=>x0+(v-lo)/(hi-lo)*(x1-x0), base=78;
  let ticks='';
  for (let v=lo, i=0; v<=hi+1e-9; v+=step, i++){ const x=sx(v), major=i%5===0; ticks+=`<line x1="${x}" x2="${x}" y1="${base}" y2="${base+(major?12:6)}" stroke="var(--line-strong)" stroke-width="1"/>`; if(major) ticks+=`<text x="${x}" y="${base+26}" text-anchor="middle">${+v.toFixed(2)}</text>`; }
  const tx=sx(T), px=sx(P), ok=P<=T;
  const anchor = x => x<130?'start':x>Wd-130?'end':'middle';
  let p2='';
  if (P2!=null){ const qx=sx(P2); p2 = `<g class="mk2" data-x="${qx}"><line x1="0" x2="0" y1="${base-30}" y2="${base}" stroke="var(--cyan)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="0" cy="${base}" r="6" fill="var(--panel)" stroke="var(--cyan)" stroke-width="2.5"/><text class="lbl" x="0" y="${base+46}" text-anchor="${anchor(qx)}" style="fill:var(--cyan)">Scenario ${fmt(P2)}</text></g>`; }
  el.innerHTML = `<svg class="ruler" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Performance ${fmt(P)} g/km against target ${fmt(T)} g/km">
    <rect x="${x0}" y="${base-4}" width="${Math.max(0,tx-x0)}" height="8" fill="var(--green-tint)"/>
    <rect x="${tx}" y="${base-4}" width="${Math.max(0,x1-tx)}" height="8" fill="var(--red-tint)"/>
    <line x1="${x0}" x2="${x1}" y1="${base}" y2="${base}" stroke="var(--line-strong)"/>
    ${ticks}
    <line x1="${tx}" x2="${tx}" y1="${base-56}" y2="${base+14}" stroke="var(--red)" stroke-width="2" stroke-dasharray="5 4"/>
    <text class="lbl" x="${tx}" y="${base-62}" text-anchor="${anchor(tx)}" style="fill:var(--red)">Target T ${fmt(T)}</text>
    <g class="mk" data-x="${px}">
      <line x1="0" x2="0" y1="${base-34}" y2="${base}" stroke="var(--blue)" stroke-width="2"/>
      <circle cx="0" cy="${base}" r="7.5" fill="var(--blue)"/><circle cx="0" cy="${base}" r="13" fill="none" stroke="var(--blue)" stroke-opacity=".25" stroke-width="5"/>
      <text class="lbl" x="0" y="${base-40}" text-anchor="${anchor(px)}" style="fill:var(--blue)">${P2!=null?'Baseline':'Performance'} P ${fmt(P)}</text>
    </g>
    ${p2}
    <text x="${x0}" y="${H-4}">g CO₂/km · ${ok?'left of the red line is compliant':'performance is above target'}</text>
  </svg>`;
  ['mk','mk2'].forEach(c=>{
    const g=$('.'+c, el); if(!g) return;
    const x=+g.dataset.x, prev = el.dataset[c]; g.setAttribute('transform',`translate(${x},0)`);
    if (prev!=null && !reduced && Math.abs(prev-x)>0.5) g.animate([{transform:`translate(${prev}px,0)`},{transform:`translate(${x}px,0)`}],{duration:420,easing:'cubic-bezier(.2,.7,.2,1)'});
    el.dataset[c]=x;
  });
}
function tween(el, to, d){
  if (!el) return; const from = parseFloat(el.dataset.v); el.dataset.v = to;
  if (reduced || !isFinite(from) || from===to){ el.textContent = fmt(to,d); return; }
  const t0=performance.now(), dur=380;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent = fmt(from+(to-from)*e, d); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function ringSVG(el, P, T){
  if (!el) return;
  const max = T*1.25, frac = Math.max(0, Math.min(1, P/max)), tfrac = T/max; // T sits at 80%
  const cx=150, cy=150, r=112, start=135, sweep=270;
  const pt = (f, rr=r)=>{ const a=(start+sweep*f)*Math.PI/180; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; };
  const arc = (f0,f1,rr=r)=>{ const [x0,y0]=pt(f0,rr),[x1,y1]=pt(f1,rr); const large=(f1-f0)*sweep>180?1:0; return `M${x0} ${y0} A${rr} ${rr} 0 ${large} 1 ${x1} ${y1}`; };
  const ok = P<=T, col = ok? 'var(--blue)' : 'var(--red)';
  let ticks=''; for(let i=0;i<=54;i++){ const f=i/54, [a,b]=pt(f,r+14), [c,d]=pt(f,r+(i%9===0?24:19)); ticks+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--line-strong)" stroke-width="${i%9===0?1.6:1}"/>`; }
  const [tx0,ty0]=pt(tfrac,r-16), [tx1,ty1]=pt(tfrac,r+28);
  const len = Math.PI*2*r*(sweep/360)*frac;
  el.innerHTML = `<svg class="ring" viewBox="0 0 300 300" role="img" aria-label="Performance ${fmt(P)} versus target ${fmt(T)} g/km">
    <defs><filter id="glw" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="rg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--cyan)"/><stop offset="1" stop-color="${ok?'var(--blue)':'var(--red)'}"/></linearGradient></defs>
    <g class="spin"><circle cx="150" cy="150" r="146" fill="none" stroke="var(--line-strong)" stroke-dasharray="2 9"/></g>
    ${ticks}
    <path d="${arc(0,tfrac)}" fill="none" stroke="var(--green-tint)" stroke-width="14" stroke-linecap="butt"/>
    <path d="${arc(tfrac,1)}" fill="none" stroke="var(--red-tint)" stroke-width="14"/>
    <path class="val" d="${arc(0,Math.max(frac,0.0001))}" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" filter="url(#glw)" stroke-dasharray="${len} 2000" stroke-dashoffset="${len}"/>
    <line x1="${tx0}" y1="${ty0}" x2="${tx1}" y2="${ty1}" stroke="var(--red)" stroke-width="3"/>
    <circle cx="150" cy="150" r="78" fill="none" stroke="var(--line)"/>
    <text x="150" y="122" text-anchor="middle" style="font-size:11px;letter-spacing:2px;fill:var(--faint);font-family:var(--body);font-weight:700">PERFORMANCE</text>
    <text x="150" y="160" text-anchor="middle" style="font-size:38px;font-weight:700;fill:var(--text)" class="num">${fmt(P,1)}</text>
    <text x="150" y="180" text-anchor="middle" style="font-size:12px;fill:var(--faint);font-family:var(--body)">g CO₂/km</text>
    <text x="150" y="206" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--red)">Target ${fmt(T,1)}</text>
  </svg>`;
  const v=$('.val',el); if (v){ if (reduced) v.setAttribute('stroke-dashoffset','0'); else v.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:900,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}); }
}

const pg = { src:'work', base:[], mode:'adjust', adj:{}, share:{}, minTech:0, ov:{} };
function pgSources(){ return [{id:'work', name:'Current calculator data', rows:state.rows}, ...SAMPLES.map(s=>({id:'s:'+s.id, name:'Sample: '+s.name, rows:sampleRows(s)})), ...state.docs.map(d=>({id:d.id, name:d.name, rows:d.rows}))]; }
function pgLoad(id){
  const s = pgSources().find(x=>x.id===id) || pgSources()[0];
  pg.src = s.id; pg.base = JSON.parse(JSON.stringify(s.rows)).filter(r=>rowIssues(r).length===0);
  pg.adj = {}; pg.ov = {}; pg.minTech = 0; pg.share = baseShares();
}
function groups(){ const g={}; pg.base.forEach(r=>g[r.fuel]=(g[r.fuel]||0)+r.vol); return g; }
function baseShares(){ const g=groups(), t=Object.values(g).reduce((a,b)=>a+b,0)||1, s={}; Object.keys(g).forEach(k=>s[k]=g[k]/t*100); return s; }
function scenRows(){
  const g = groups(), tot = Object.values(g).reduce((a,b)=>a+b,0);
  return pg.base.map((r,i)=>{
    let vol = r.vol;
    if (pg.mode==='adjust') vol = r.vol*(1+(pg.adj[r.fuel]||0)/100);
    else vol = g[r.fuel]? r.vol*((pg.share[r.fuel]||0)/100*tot)/g[r.fuel] : 0;
    if (pg.ov[i]!=null) vol = pg.ov[i];
    return {...r, vol: Math.max(0, vol)};
  });
}
function renderPlayground(v){
  const q = new URLSearchParams(location.hash.split('?')[1]||'');

  <div id="pgBody"></div>`;

  box.innerHTML = `<div class="panel-head"><div><h3>Saved scenarios</h3><p>Compare what-ifs side by side. Kept in this browser.</p></div></div>
    ${list.length? `<div class="table-wrap"><table class="cmp"><thead><tr><th>Scenario</th><th>Dataset</th><th class="r">Volume</th><th class="r">P</th><th class="r">T</th><th class="r">Margin</th><th>Compliance</th><th class="r">Exposure ₹ cr</th><th></th></tr></thead><tbody>
      ${list.map(s=>`<tr><td style="color:var(--text)"><b>${esc(s.name)}</b><div class="faint" style="font-weight:400;font-size:12px">${esc(s.desc)}</div></td><td class="muted" style="font-weight:400">${esc(s.src)}</td><td class="r num">${fint(s.J)}</td><td class="r num">${fmt(s.P)}</td><td class="r num">${fmt(s.T)}</td><td class="r num ${s.margin>=0?'pos':'neg'}">${sign(s.margin)}</td><td><span class="status-dot ${s.complied?'ok':'bad'}">${s.complied?'Yes':'No'}</span></td><td class="r num">${fmt(s.pen,2)}</td>
      <td><button class="btn sm ghost danger" data-act="delScen" data-id="${s.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="empty" style="padding:28px">Saved scenarios appear here for side-by-side comparison.</div>`}`;
}
function pgDesc(){
  const g=groups(), f=FUELS.filter(x=>g[x]>0);
  const parts = pg.mode==='adjust'? f.filter(x=>pg.adj[x]).map(x=>`${x} ${pg.adj[x]>0?'+':''}${pg.adj[x]}%`) : f.map(x=>`${x} ${(pg.share[x]||0).toFixed(1)}%`);
  if (pg.minTech) parts.push(`min ${pg.minTech} tech`); const pins=Object.keys(pg.ov).length; if(pins) parts.push(`${pins} pinned`);
  return parts.join(', ') || 'No changes';
}

/* ================= global actions ================= */
document.addEventListener('click', e=>{
  const s = e.target.closest('[data-sample]');
  if (s){ const x=SAMPLES.find(y=>y.id===s.dataset.sample); state.rows=padRows(sampleRows(x)); state.manufacturer=x.manufacturer; state.docId=null; state.docName=''; saveWork(); toast('Loaded sample: '+x.name); if(route()==='cafe2') render(); else location.hash='#cafe2'; return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, i = +b.dataset.i, id=b.dataset.id;
  const arm = (fn)=>{ if (b.classList.contains('armed')) return fn(); const t=b.textContent; b.classList.add('armed'); b.textContent='Confirm'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent=t; } }, 3000); };
  switch(a){
    case 'upload': pickFile(); break;
    case 'template': downloadTemplate(); break;
    case 'export': exportResults(); break;
    case 'addRow': case 'addRows': { const k = a==='addRow'? 1 : Math.max(1, Math.min(500, parseInt($('#addN')?.value)||10)); const start=state.rows.length; for(let q=0;q<k;q++) state.rows.push(blankRow()); saveWork(); renderTable(); updateResults(); const ins=$(`#tableBox [data-i="${start}"][data-k="brand"]`); if(ins){ ins.focus(); ins.scrollIntoView({block:'center'}); } toast(`Added ${k} row${k>1?'s':''}`); break; }
    case 'trimRows': { const before=state.rows.length; state.rows = padRows(filledRows(state.rows), 1); saveWork(); renderTable(); updateResults(); toast(`Removed ${before-state.rows.length} empty row${before-state.rows.length===1?'':'s'}`); break; }
    case 'dupRow': state.rows.splice(i+1,0,{...state.rows[i], id:uid()}); saveWork(); renderTable(); updateResults(); break;
    case 'delRow': state.rows.splice(i,1); if(!state.rows.length) state.rows.push(blankRow()); saveWork(); renderTable(); updateResults(); break;
    case 'clearRows': arm(()=>{ state.rows=padRows([]); state.docId=null; state.docName=''; saveWork(); render(); }); break;
    case 'saveDoc': {
      if (!filledRows(state.rows).length){ toast('Fill at least one line before saving.', true); break; }
      const name = state.docName || (state.manufacturer? state.manufacturer+' CAFE II' : 'CAFE II calculation')+' '+new Date().toLocaleDateString('en-IN');
      const d = upsertDoc({id:state.docId, name, source: state.docId? (state.docs.find(x=>x.id===state.docId)?.source||'Manual') : 'Manual', rows:filledRows(state.rows), manufacturer:state.manufacturer});
      state.docId=d.id; state.docName=d.name; saveWork(); toast('Saved to documents: '+d.name); render(); break; }
    case 'openDoc': { const d=state.docs.find(x=>x.id===id); if(d){ loadDocToWork(d); location.hash='#cafe2'; } break; }
    case 'pgDoc': location.hash='#playground?doc='+id; break;
    case 'delDoc': arm(()=>{ state.docs=state.docs.filter(x=>x.id!==id); if(state.docId===id){ state.docId=null; state.docName=''; saveWork(); } saveDocs(); toast('Document deleted'); render(); }); break;
    case 'clearDocs': arm(()=>{ state.docs=[]; state.docId=null; state.docName=''; saveWork(); saveDocs(); toast('All documents deleted'); render(); }); break;
    case 'pgReset': pg.adj={}; pg.ov={}; pg.minTech=0; pg.share=baseShares(); pgBody(); break;
    case 'pgSave': {
      const S=calcCafe2(scenRows(),{minTech:pg.minTech||null}); if(S.empty) break;
      const nm = ($('#scName').value.trim()) || 'Scenario '+(state.scen.length+1);
      state.scen.unshift({id:uid(), name:nm, desc:pgDesc(), src:(pgSources().find(x=>x.id===pg.src)||{}).name||'', J:S.J, P:S.P, T:S.T, margin:S.margin, complied:S.complied, pen:S.penaltyCr});
      sset(KEYS.scen, state.scen); pgSavedList(); $('#scName').value=''; toast('Scenario saved: '+nm); break; }
    case 'delScen': arm(()=>{ state.scen=state.scen.filter(x=>x.id!==id); sset(KEYS.scen,state.scen); pgSavedList(); }); break;
    case 'pgApply': {
      const rows=scenRows();
      if (pg.minTech) rows.forEach(r=>{ const keys=['regen','ss','tpms','six']; let have=keys.filter(k=>r[k]==='Y').length; for(const k of keys){ if(have>=pg.minTech) break; if(r[k]!=='Y'){ r[k]='Y'; have++; } } });
      state.rows = padRows(rows.map(r=>({...r, id:uid(), vol:Math.round(r.vol)}))); state.docId=null; state.docName=''; state.manufacturer = state.manufacturer || mostCommon(rows.map(r=>r.brand));
      saveWork(); toast('Scenario sent to calculator. Save it to keep it as a document.'); location.hash='#cafe2'; break; }
  }
});

/* ================= shell ================= */
$('#menuBtn').addEventListener('click', ()=>document.body.classList.add('nav-open'));
$('#overlay').addEventListener('click', ()=>document.body.classList.remove('nav-open'));
(function theme(){
  const saved = sget(KEYS.theme, null); document.documentElement.dataset.theme = saved || 'dark';
  const lbl = ()=>{ $('#themeLbl').textContent = document.documentElement.dataset.theme==='dark'? 'Light mode' : 'Dark mode'; };
  lbl();
  $('#themeBtn').addEventListener('click', ()=>{ const next = document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=next; sset(KEYS.theme,next); lbl(); render(); dispatchEvent(new Event('themechange')); });
})();
(function clock(){ const t=()=>{ const el=$('#clock'); if(el) el.textContent=new Date().toLocaleString('en-IN',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }; t(); setInterval(t,30000); })();

$('#docCount').textContent = state.docs.length || '';
render();

/* ================= background designs ================= */
const BG_STYLES = [
  {id:'calm', name:'Calm flow'},
  {id:'constellation', name:'Constellation'},
  {id:'contour', name:'Contour map'},
  {id:'signal', name:'Signal grid'},
  {id:'none', name:'Still grid'},
];
(function bg(){
  const cv=$('#flow'), cs=$('#flowSide'); if(!cv) return;
  let style = sget('mlx.bg', 'calm'); if (!BG_STYLES.some(b=>b.id===style)) style='calm';
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let D=1, W=0, H=0, last=0, running=true, nodes=[], pings=[];
  function fit(c){ const d=Math.min(2,devicePixelRatio||1), r=c.getBoundingClientRect(); c.width=Math.max(1,r.width*d); c.height=Math.max(1,r.height*d); return d; }
  function seed(){
    nodes = Array.from({length: Math.round(Math.min(70, W*H/(D*D)/26000))}, ()=>({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.05*D, vy:(Math.random()-.5)*.05*D, r:(Math.random()*1.2+.8)*D}));
    pings = [];
  }
  function resize(){ D=fit(cv); W=cv.width; H=cv.height; if(cs) fit(cs); seed(); paint(performance.now(), true); }
  const wave = (L,x,t)=> H*(L.y + L.a*Math.sin(x/W*Math.PI*2*L.f + t*L.s) + L.a*.4*Math.sin(x/W*Math.PI*2*L.f*2.1 - t*L.s*.7 + L.p));
  const CALM = [
    {y:.56,a:.05,f:.55,s:.00006,c:'--blue',al:.38,p:0},
    {y:.74,a:.04,f:.8,s:-.00005,c:'--cyan',al:.26,p:1.7},
    {y:.92,a:.03,f:1.1,s:.00004,c:'--blue',al:.2,p:3.1},
  ];
  function line(g, L, t, w, step){
    const col=css(L.c), grad=g.createLinearGradient(0,0,W,0);
    grad.addColorStop(0,'transparent'); grad.addColorStop(.25,col); grad.addColorStop(.8,col); grad.addColorStop(1,'transparent');
    g.globalAlpha=L.al; g.strokeStyle=grad; g.lineWidth=w;
    g.beginPath(); for(let x=0;x<=W;x+=step){ const y=wave(L,x,t); x? g.lineTo(x,y):g.moveTo(x,y); } g.stroke();
  }
  function paint(t){
    const g=cv.getContext('2d'); g.clearRect(0,0,W,H); g.globalAlpha=1;
    const blue=css('--blue'), cyan=css('--cyan'), red=css('--red');
    if (style==='calm'){
      CALM.forEach(L=>line(g,L,t,1.3*D,12*D));
      const L=CALM[0], x=((t*.012*D)%(W+200*D))-100*D; g.globalAlpha=.45; g.fillStyle=cyan; g.beginPath(); g.arc(x,wave(L,x,t),2.4*D,0,7); g.fill();
    }
    else if (style==='constellation'){
      const maxd=150*D; g.lineWidth=1*D;
      nodes.forEach(n=>{ n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1; });
      for(let i=0;i<nodes.length;i++) for(let k=i+1;k<nodes.length;k++){ const a=nodes[i], b=nodes[k], d=Math.hypot(a.x-b.x,a.y-b.y); if(d<maxd){ g.globalAlpha=(1-d/maxd)*.26; g.strokeStyle=blue; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
      nodes.forEach((n,i)=>{ g.globalAlpha= i%11===0? .7 : .45; g.fillStyle= i%11===0? red : cyan; g.beginPath(); g.arc(n.x,n.y,n.r,0,7); g.fill(); });
    }
    else if (style==='contour'){
      const cx=W*.82, cy=H*.18, gap=34*D; g.lineWidth=1*D;
      for(let k=1;k<=26;k++){
        g.globalAlpha = Math.max(0,.26 - k*.008); g.strokeStyle = k%5===0? cyan : blue; g.beginPath();
        for(let s=0;s<=96;s++){ const th=s/96*Math.PI*2, r=k*gap + 10*D*Math.sin(3*th + k*.35 + t*.00012) + 7*D*Math.sin(5*th - k*.2 - t*.00008); const x=cx+r*Math.cos(th)*1.25, y=cy+r*Math.sin(th); s? g.lineTo(x,y):g.moveTo(x,y); }
        g.closePath(); g.stroke();
      }
    }
    else if (style==='signal'){
      const step=51.2*D*(parseFloat(getComputedStyle(document.documentElement).fontSize)/16);
      if (Math.random()<.035 && pings.length<14) pings.push({x:Math.round(Math.random()*W/step)*step, y:Math.round(Math.random()*H/step)*step, t0:t, red:Math.random()<.15});
      pings = pings.filter(p=>t-p.t0<3200);
      pings.forEach(p=>{ const k=(t-p.t0)/3200, a=Math.sin(Math.PI*k); g.globalAlpha=a*.75; g.fillStyle=p.red?red:cyan; g.beginPath(); g.arc(p.x,p.y,2.4*D,0,7); g.fill();
        g.globalAlpha=a*.25; g.strokeStyle=p.red?red:cyan; g.lineWidth=1*D; g.beginPath(); g.arc(p.x,p.y,(4+k*16)*D,0,7); g.stroke();
        g.globalAlpha=a*.12; g.beginPath(); g.moveTo(p.x-step,p.y); g.lineTo(p.x+step,p.y); g.moveTo(p.x,p.y-step); g.lineTo(p.x,p.y+step); g.stroke(); });
    }
    g.globalAlpha=1;
    if (cs && cs.offsetParent){ const h=cs.getContext('2d'), w=cs.width, hh=cs.height; h.clearRect(0,0,w,hh);
      [[.55,.16,1.1,blue,.8],[.75,.1,1.6,cyan,.45]].forEach(([y,a,f,c,al],i)=>{ h.globalAlpha=al; h.strokeStyle=c; h.lineWidth=1.3*D; h.beginPath(); for(let x=0;x<=w;x+=3*D){ const yy=hh*(y+a*Math.sin(x/w*Math.PI*2*f + (style==='none'||reduced?0:t*.0003*(i?-1:1)))); x?h.lineTo(x,yy):h.moveTo(x,yy);} h.stroke(); });
      h.globalAlpha=1; }
  }
  const animated = ()=> style!=='none' && !reduced;
  function frame(t){ if (t-last>40){ last=t; paint(t); } if (animated() && running) requestAnimationFrame(frame); }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', ()=>{ running=!document.hidden; if(running && animated()) requestAnimationFrame(frame); });
  window.setBg = id => { style=id; sset('mlx.bg', id); seed(); paint(performance.now()); if (animated()) requestAnimationFrame(frame); $$('#bgSel button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.bg===id)); };
  const sel=$('#bgSel');
  if (sel){ sel.innerHTML = BG_STYLES.map(b=>`<button type="button" data-bg="${b.id}" aria-pressed="${b.id===style}" title="${b.name}"><i class="bg-ic bg-${b.id}"></i><span>${b.name}</span></button>`).join(''); sel.addEventListener('click', e=>{ const b=e.target.closest('[data-bg]'); if(b) setBg(b.dataset.bg); }); }
  addEventListener('themechange', ()=>paint(performance.now()));
  resize(); if (animated()) requestAnimationFrame(frame);
})();

</script>
